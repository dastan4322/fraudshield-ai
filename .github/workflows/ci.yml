name: CI
on: [push, pull_request]
jobs:
  backend:
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fraudshield_test
          POSTGRES_USER: fraudshield
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudshield -d fraudshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://fraudshield:ci-only-ephemeral-password@localhost:5432/fraudshield_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - name: Browser integration
        env:
          BASE_URL: http://127.0.0.1:3000
          CHROMIUM_PATH: ""
        run: |
          python -m uvicorn app.main:app --app-dir backend > /tmp/fraudshield-api.log 2>&1 &
          npm --prefix frontend start > /tmp/fraudshield-web.log 2>&1 &
          python - <<'PYTHON'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:3000/api/health")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Services did not become ready")
          PYTHON
          python scripts/workspace_e2e.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
