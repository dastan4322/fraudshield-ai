services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WORKSPACE_TOKEN: ${WORKSPACE_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
